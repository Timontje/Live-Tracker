<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discord 1K</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ==============================
   BANNER
   ============================== */

.banner {
    width: 1000px;
    height: 230px;

    display: flex;
    align-items: center;

    padding: 25px 32px;
    gap: 28px;

    border-radius: 30px;

    background: linear-gradient(
        135deg,
        #15151f 0%,
        #241b3b 100%
    );

    border: 2px solid rgba(255,255,255,0.12);

    box-shadow:
        0 10px 40px rgba(0,0,0,0.35),
        0 0 35px rgba(88,101,242,0.25);

    color: #fff;
}


/* ==============================
   DISCORD
   ============================== */

.discord {
    width: 135px;
    height: 135px;

    flex: 0 0 135px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 28px;

    background: #5865f2;

    font-size: 68px;

    box-shadow:
        0 0 25px rgba(88,101,242,0.55);
}


/* ==============================
   CONTENT
   ============================== */

.content {
    flex: 1;
    min-width: 0;
}

.title {
    font-size: 32px;
    line-height: 1.1;

    font-weight: 900;

    margin-bottom: 7px;
}

.subtitle {
    font-size: 17px;

    font-weight: 600;

    color: rgba(255,255,255,0.62);

    margin-bottom: 15px;
}


/* ==============================
   PROGRESS
   ============================== */

.progress {
    width: 100%;
    height: 26px;

    overflow: hidden;

    border-radius: 50px;

    background: rgba(255,255,255,0.10);
}

.progress-fill {
    height: 100%;
    width: 0%;

    border-radius: 50px;

    background: linear-gradient(
        90deg,
        #5865f2,
        #8b5cf6,
        #c084fc
    );

    transition: width 0.7s ease;
}


/* ==============================
   COUNTDOWN
   ============================== */

.countdown {
    margin-top: 12px;

    font-size: 24px;

    line-height: 1;

    font-weight: 900;

    color: #c4b5fd;

    white-space: nowrap;
}


/* ==============================
   MEMBERS
   ============================== */

.stats {
    width: 170px;

    flex: 0 0 170px;

    text-align: center;
}

.members {
    font-size: 42px;

    line-height: 1;

    font-weight: 900;

    white-space: nowrap;
}

.goal {
    margin-top: 8px;

    font-size: 17px;

    font-weight: 700;

    color: rgba(255,255,255,0.55);
}


/* ==============================
   KLEINERE SCHERMEN
   ============================== */

@media (max-width: 1050px) {

    .banner {
        width: calc(100vw - 20px);
    }
}


@media (max-width: 700px) {

    .banner {
        height: 180px;

        padding: 20px;

        gap: 18px;

        border-radius: 24px;
    }

    .discord {
        width: 100px;
        height: 100px;

        flex-basis: 100px;

        font-size: 52px;

        border-radius: 22px;
    }

    .title {
        font-size: 23px;
    }

    .subtitle {
        font-size: 13px;

        margin-bottom: 10px;
    }

    .progress {
        height: 20px;
    }

    .countdown {
        font-size: 17px;
    }

    .stats {
        width: 110px;

        flex-basis: 110px;
    }

    .members {
        font-size: 30px;
    }

    .goal {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="banner">

    <!-- DISCORD ICOON -->
    <div class="discord">
        💬
    </div>


    <!-- MIDDEN -->
    <div class="content">

        <div class="title">
            Discord 1K Members
        </div>

        <div class="subtitle">
            Help ons de 1.000 members te bereiken!
        </div>

        <div class="progress">
            <div
                class="progress-fill"
                id="progress">
            </div>
        </div>

        <div
            class="countdown"
            id="countdown">
            ⏳ Laden...
        </div>

    </div>


    <!-- MEMBER AANTAL -->
    <div class="stats">

        <div
            class="members"
            id="members">
            ...
        </div>

        <div class="goal">
            / 1.000
        </div>

    </div>

</div>


<script>
const INVITE = "ddhrpnl";
const GOAL = 1000;

const membersEl =
    document.getElementById("members");

const progressEl =
    document.getElementById("progress");

const countdownEl =
    document.getElementById("countdown");


/* ==============================
   MEMBERS OPHALEN
   ============================== */

async function getMembers() {

    try {

        const response = await fetch(
            "https://discord.com/api/v10/invites/"
            + INVITE
            + "?with_counts=true"
        );

        if (!response.ok) {
            throw new Error("Discord API error");
        }

        const data = await response.json();

        const members =
            Number(data.approximate_member_count) || 0;


        /* AANTAL */

        membersEl.textContent =
            members.toLocaleString("nl-NL");


        /* PROGRESS */

        const percentage =
            Math.min(
                (members / GOAL) * 100,
                100
            );

        progressEl.style.width =
            percentage + "%";

    } catch (error) {

        console.log(error);

        /*
         * De banner blijft gewoon zichtbaar
         * als Discord tijdelijk niet reageert.
         */

        if (membersEl.textContent === "...") {
            membersEl.textContent = "—";
        }
    }
}


/* ==============================
   COUNTDOWN
   ============================== */

const deadline =
    new Date("2026-10-31T23:59:59").getTime();


function updateCountdown() {

    const now =
        Date.now();

    const remaining =
        deadline - now;


    if (remaining <= 0) {

        countdownEl.textContent =
            "🔥 DEADLINE BEREIKT!";

        return;
    }


    const days =
        Math.floor(
            remaining /
            (1000 * 60 * 60 * 24)
        );


    const hours =
        Math.floor(
            (remaining /
            (1000 * 60 * 60)) % 24
        );


    const minutes =
        Math.floor(
            (remaining /
            (1000 * 60)) % 60
        );


    const seconds =
        Math.floor(
            (remaining / 1000) % 60
        );


    countdownEl.textContent =
        "⏳ "
        + days + "d "
        + hours + "u "
        + minutes + "m "
        + seconds + "s";
}


/* ==============================
   START
   ============================== */

getMembers();
updateCountdown();


/*
 * Discord iedere 30 seconden
 */
setInterval(
    getMembers,
    30000
);


/*
 * Countdown iedere seconde
 */
setInterval(
    updateCountdown,
    1000
);
</script>

</body>
</html>
