<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discord 1K TikTok Live</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:transparent;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        "Segoe UI",
        Arial,
        sans-serif;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;

    color:#fff;
}

/* =========================================
   TIKTOK BANNER
   700 x 162 PX
========================================= */

.overlay{
    width:700px;
    height:162px;

    max-width:94vw;

    padding:18px 24px;

    display:flex;
    flex-direction:column;
    justify-content:center;

    position:relative;
    overflow:hidden;

    border-radius:22px;

    background:
        linear-gradient(
            110deg,
            rgba(18,19,27,.97),
            rgba(10,11,17,.97)
        );

    border:1px solid rgba(255,255,255,.13);

    box-shadow:
        0 12px 45px rgba(0,0,0,.48),
        inset 0 1px 0 rgba(255,255,255,.07);
}

/* Paarse glow */

.overlay::before{
    content:"";

    position:absolute;

    width:260px;
    height:260px;

    top:-170px;
    right:-50px;

    background:#8b5cf6;

    opacity:.17;

    filter:blur(45px);

    border-radius:50%;

    pointer-events:none;
}

/* =========================================
   TOP
========================================= */

.top{
    height:24px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    position:relative;
    z-index:2;
}

.live{
    display:flex;
    align-items:center;

    gap:8px;

    font-size:13px;
    font-weight:900;

    letter-spacing:1.3px;
}

.dot{
    width:9px;
    height:9px;

    border-radius:50%;

    background:#ff3158;

    box-shadow:
        0 0 13px rgba(255,49,88,.95);

    animation:pulse 1.4s infinite;
}

.badge{
    padding:5px 11px;

    border-radius:999px;

    background:rgba(255,255,255,.07);

    border:1px solid rgba(255,255,255,.1);

    font-size:10px;
    font-weight:800;

    color:#c9cbd3;
}

/* =========================================
   MAIN ROW
========================================= */

.middle{
    display:flex;
    align-items:center;

    gap:18px;

    position:relative;
    z-index:2;

    margin-top:4px;
}

/* Titel */

.title{
    font-size:22px;

    font-weight:900;

    letter-spacing:-.7px;

    white-space:nowrap;
}

/* Members */

.memberBox{
    display:flex;
    align-items:baseline;

    gap:5px;

    white-space:nowrap;
}

.members{
    font-size:42px;

    line-height:1;

    font-weight:950;

    letter-spacing:-2.5px;
}

.target{
    font-size:12px;

    color:#9b9daa;

    font-weight:800;
}

.change{
    margin-left:4px;

    font-size:12px;

    font-weight:900;

    opacity:0;
}

.change.show{
    animation:pop .8s ease forwards;
}

.change.up{
    color:#54f29a;
}
