<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discord 1K TikTok Live</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:transparent;
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:5px;
    color:#fff;
}

/* =========================================
   ULTRA DUNNE TIKTOK BANNER
   ongeveer 380 x 90 px
========================================= */

.overlay{
    width:380px;
    max-width:96vw;
    height:88px;

    padding:10px 13px;

    display:flex;
    flex-direction:column;
    justify-content:center;

    border-radius:14px;

    background:
        linear-gradient(
            110deg,
            rgba(18,19,27,.97),
            rgba(10,11,17,.97)
        );

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
        0 8px 30px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.06);

    position:relative;
    overflow:hidden;
}

/* Paarse glow */
.overlay:before{
    content:"";
    position:absolute;

    width:150px;
    height:150px;

    top:-100px;
    right:-35px;

    background:#8b5cf6;
    opacity:.16;

    filter:blur(30px);
    border-radius:50%;

    pointer-events:none;
}

/* =========================================
   BOVENSTE RIJ
========================================= */

.top{
    height:16px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    position:relative;
    z-index:1;
}

.live{
    display:flex;
    align-items:center;
    gap:5px;

    font-size:8px;
    font-weight:900;
    letter-spacing:1px;
}

.dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:#ff3158;

    box-shadow:
        0 0 9px rgba(255,49,88,.9);

    animation:pulse 1.4s infinite;
}

.badge{
    padding:3px 7px;

    border-radius:999px;

    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.09);

    font-size:7px;
    font-weight:800;

    color:#c9cbd3;
}

/* =========================================
   MIDDEN
========================================= */

.middle{
    display:flex;
    align-items:center;

    gap:10px;

    position:relative;
    z-index:1;

    margin-top:2px;
}

/* Titel */

.title{
    font-size:13px;
    font-weight:900;

    white-space:nowrap;

    letter-spacing:-.3px;
}

/* Member count */

.memberBox{
    display:flex;
    align-items:baseline;

    gap:3px;

    white-space:nowrap;
}

.members{
    font-size:25px;
    line-height:1;

    font-weight:950;

    letter-spacing:-1.5px;
}

.target{
    font-size:8px;

    color:#8f91a0;

    font-weight:700;
}

.change{
    font-size:8px;
    font-weight:900;

    opacity:0;

    margin-left:2px;
}

.change.show{
    animation:pop .8s ease forwards;
}

.change.up{
    color:#54f29a;
}

.change.down{
    color:#ff5f72;
}

/* =========================================
   PROGRESS
========================================= */

.progressBox{
    flex:1;

    min-width:65px;

    display:flex;
    flex-direction:column;

    gap:3px;
}

.progress{
    width:100%;
    height:6px;

    border-radius:99px;

    background:rgba(255,255,255,.09);

    overflow:hidden;
}

.bar{
    width:0%;
    height:100%;

    border-radius:99px;

    background:
        linear-gradient(
            90deg,
            #7c3aed,
            #ec4899
        );

    box-shadow:
        0 0 10px rgba(168,85,247,.45);

    transition:
        width .8s cubic-bezier(.2,.8,.2,1);

    position:relative;
}

.bar:after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.6),
            transparent
        );

    transform:translateX(-100%);
}

.bar.animate:after{
    animation:shine .75s ease;
}

.percent{
    font-size:7px;
    color:#858795;

    text-align:right;
}

/* =========================================
   COUNTDOWN
========================================= */

.countdown{
    display:flex;
    align-items:center;

    gap:4px;

    white-space:nowrap;

    padding-left:4px;
}

.countdownLabel{
    font-size:7px;

    color:#858795;

    font-weight:800;

    text-transform:uppercase;
}

.time{
    display:flex;
    align-items:baseline;

    gap:2px;
}

.time b{
    font-size:12px;
    font-weight:900;

    letter-spacing:-.3px;
}

.time span{
    font-size:7px;
    color:#858795;
}

.separator{
    color:#555766;

    font-size:10px;

    font-weight:900;
}

/* =========================================
   ONDERSTE RIJ
========================================= */

.bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-top:3px;

    position:relative;
    z-index:1;
}

.sub{
    font-size:7px;
    color:#858795;
}

.call{
    font-size:8px;
    font-weight:900;

    color:#fff;

    white-space:nowrap;
}

/* =========================================
   COMPLEET
========================================= */

.complete{
    border-color:rgba(84,242,154,.55);

    box-shadow:
        0 8px 30px rgba(0,0,0,.45),
        0 0 25px rgba(84,242,154,.16);
}

.complete .bar{
    background:
        linear-gradient(
            90deg,
            #22c55e,
            #54f29a
        );

    box-shadow:
        0 0 13px rgba(84,242,154,.55);
}

.complete .call{
    color:#54f29a;
}

/* =========================================
   ANIMATIES
========================================= */

@keyframes pulse{
    0%,100%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(.65);
        opacity:.55;
    }
}

@keyframes pop{
    0%{
        opacity:0;
        transform:translateY(3px) scale(.9);
    }

    25%{
        opacity:1;
        transform:translateY(0) scale(1.05);
    }

    75%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:translateY(-3px);
    }
}

@keyframes shine{
    from{
        transform:translateX(-100%);
    }

    to{
        transform:translateX(100%);
    }
}

/* =========================================
   CONFETTI
========================================= */

.confetti{
    position:fixed;

    top:-15px;

    width:5px;
    height:8px;

    pointer-events:none;

    z-index:100;

    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:
            translateY(110vh)
            rotate(720deg);

        opacity:0;
    }
}

/* =========================================
   EXTRA SMAL
========================================= */

@media(max-width:360px){

    .overlay{
        width:350px;
        height:84px;

        padding:9px 10px;
    }

    .title{
        font-size:12px;
    }

    .members{
        font-size:22px;
    }

    .countdown{
        gap:3px;
    }

    .time b{
        font-size:11px;
    }
}
</style>
</head>

<body>

<div class="overlay" id="card">

    <!-- BOVEN -->
    <div class="top">

        <div class="live">
            <span class="dot"></span>
            TIKTOK LIVE
        </div>

        <div class="badge">
            DISCORD
        </div>

    </div>


    <!-- MIDDEN -->
    <div class="middle">

        <div class="title">
            🚀 Op naar 1K
        </div>

        <div class="memberBox">

            <span
                class="members"
                id="members"
            >
                ...
            </span>

            <span class="target">
                / 1.000
            </span>

            <span
                class="change"
                id="change"
            ></span>

        </div>


        <div class="progressBox">

            <div class="progress">

                <div
                    class="bar"
                    id="bar"
                ></div>

            </div>

            <div
                class="percent"
                id="percent"
            >
                0%
            </div>

        </div>


        <!-- COUNTDOWN -->

        <div class="countdown">

            <span class="countdownLabel">
                ⏳
            </span>

            <div class="time">
                <b id="days">00</b>
                <span>d</span>
            </div>

            <span class="separator">:</span>

            <div class="time">
                <b id="hours">00</b>
                <span>u</span>
            </div>

            <span class="separator">:</span>

            <div class="time">
                <b id="minutes">00</b>
                <span>m</span>
            </div>

        </div>

    </div>


    <!-- ONDER -->
    <div class="bottom">

        <div class="sub">
            Help ons deze maand de 1K te halen!
        </div>

        <div
            class="call"
            id="call"
        >
            🎯 Samen naar de 1.000!
        </div>

    </div>

</div>


<script>

const INVITE = "ddhrpnl";

const GOAL = 1000;

/* Deadline oktober 2026 */
const DEADLINE =
    new Date("2026-10-31T23:59:59");


const members =
    document.getElementById("members");

const change =
    document.getElementById("change");

const bar =
    document.getElementById("bar");

const percent =
    document.getElementById("percent");

const card =
    document.getElementById("card");


let oldCount = null;

let celebrated = false;


/* =========================================
   DISCORD MEMBERS
========================================= */

async function updateMembers(){

    try{

        const response =
            await fetch(
                "https://discord.com/api/v10/invites/" +
                INVITE +
                "?with_counts=true"
            );


        if(!response.ok){

            throw new Error(
                "Discord API error"
            );

        }


        const data =
            await response.json();


        const count =
            data.approximate_member_count;


        if(typeof count !== "number"){

            throw new Error(
                "Geen member count"
            );

        }


        if(oldCount === null){

            members.textContent =
                count;

        }


        /* Member verandering */

        if(
            oldCount !== null &&
            count !== oldCount
        ){

            members.classList.remove(
                "up",
                "down"
            );

            change.classList.remove(
                "show",
                "up",
                "down"
            );

            bar.classList.remove(
                "animate"
            );


            void members.offsetWidth;
            void change.offsetWidth;
            void bar.offsetWidth;


            const increased =
                count > oldCount;


            change.textContent =
                (increased ? "↑ +" : "↓ ") +
                Math.abs(
                    count - oldCount
                );


            change.classList.add(
                "show",
                increased ? "up" : "down"
            );


            bar.classList.add(
                "animate"
            );


            members.textContent =
                count;

        }


        /* Progress */

        const progress =
            Math.min(
                (count / GOAL) * 100,
                100
            );


        bar.style.width =
            progress + "%";


        percent.textContent =
            Math.floor(progress) + "%";


        /* 1K gehaald */

        if(
            count >= GOAL &&
            !celebrated
        ){

            celebrated = true;

            card.classList.add(
                "complete"
            );


            document.getElementById(
                "call"
            ).textContent =
                "🎉 1.000 GEHAALD!";


            createConfetti();

        }


        oldCount =
            count;


    }catch(error){

        console.error(error);


        if(oldCount === null){

            members.textContent =
                "—";

        }

    }

}


/* =========================================
   COUNTDOWN
========================================= */

function updateCountdown(){

    const diff =
        DEADLINE.getTime() -
        Date.now();


    if(diff <= 0){

        [
            "days",
            "hours",
            "minutes"
        ].forEach(
            id =>
                document.getElementById(
                    id
                ).textContent = "00"
        );


        document.getElementById(
            "call"
        ).textContent =
            "🔥 Deadline bereikt!";


        return;

    }


    const totalSeconds =
        Math.floor(
            diff / 1000
        );


    const days =
        Math.floor(
            totalSeconds / 86400
        );


    const hours =
        Math.floor(
            (totalSeconds % 86400) /
            3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) /
            60
        );


    document.getElementById(
        "days"
    ).textContent =
        String(days).padStart(
            2,
            "0"
        );


    document.getElementById(
        "hours"
    ).textContent =
        String(hours).padStart(
            2,
            "0"
        );


    document.getElementById(
        "minutes"
    ).textContent =
        String(minutes).padStart(
            2,
            "0"
        );

}


/* =========================================
   CONFETTI
========================================= */

function createConfetti(){

    const colors = [
        "#8b5cf6",
        "#ec4899",
        "#22c55e",
        "#38bdf8",
        "#facc15",
        "#ffffff"
    ];


    for(
        let i = 0;
        i < 150;
        i++
    ){

        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        piece.style.left =
            Math.random() *
            100 +
            "vw";


        piece.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        piece.style.animationDuration =
            2 +
            Math.random() * 3 +
            "s";


        piece.style.animationDelay =
            Math.random() * .7 +
            "s";


        document.body.appendChild(
            piece
        );


        setTimeout(
            () => piece.remove(),
            6000
        );

    }

}


/* START */

updateMembers();

updateCountdown();


setInterval(
    updateMembers,
    10000
);


setInterval(
    updateCountdown,
    1000
);

</script>

</body>
</html>
