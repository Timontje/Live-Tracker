<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discord Live Members</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    background: transparent;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

/* BREDE KAART */

.card {
    width: 560px;
    max-width: 95vw;
    height: 125px;

    padding: 16px 22px;

    display: flex;
    align-items: center;
    gap: 22px;

    background: #161b22;

    border: 1px solid #30363d;
    border-radius: 12px;

    color: white;

    box-shadow:
        0 6px 20px rgba(0,0,0,.35);
}

/* LINKER DEEL */

.info {
    width: 145px;
    flex-shrink: 0;
}

.live {
    display: inline-flex;
    align-items: center;
    gap: 6px;

    margin-bottom: 7px;
    padding: 3px 7px;

    border-radius: 5px;

    background: #21262d;
    border: 1px solid #30363d;

    color: #3fb950;

    font-size: 8px;
    font-weight: 700;

    letter-spacing: 1px;
}

.dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #3fb950;

    box-shadow:
        0 0 7px rgba(63,185,80,.7);

    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0%,100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: .4;
        transform: scale(.7);
    }
}

.title {
    color: #8b949e;

    font-size: 8px;
    font-weight: 600;

    letter-spacing: 1.2px;

    text-transform: uppercase;

    margin-bottom: 2px;
}

h1 {
    margin: 0;

    color: #f0f6fc;

    font-size: 15px;
    font-weight: 500;
}

/* MIDDEN */

.counter {
    flex: 1;
    min-width: 0;
}

.members {
    font-size: 42px;
    line-height: 1;

    font-weight: 600;

    letter-spacing: -2px;

    color: #f0f6fc;

    white-space: nowrap;
}

/* OMHOOG */

.members.up {
    animation:
        memberUp .55s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes memberUp {

    0% {
        transform:
            translateY(10px)
            scale(.88);

        opacity: .2;

        filter: blur(3px);
    }

    40% {
        transform:
            translateY(-5px)
            scale(1.08);

        opacity: 1;

        color: #3fb950;

        text-shadow:
            0 0 14px
            rgba(63,185,80,.7);
    }

    70% {
        transform:
            translateY(2px)
            scale(1.02);
    }

    100% {
        transform:
            translateY(0)
            scale(1);

        color: #f0f6fc;

        text-shadow: none;

        filter: blur(0);
    }
}

/* OMLAAG */

.members.down {
    animation:
        memberDown .55s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes memberDown {

    0% {
        transform:
            translateY(-10px)
            scale(.88);

        opacity: .2;

        filter: blur(3px);
    }

    40% {
        transform:
            translateY(5px)
            scale(1.08);

        opacity: 1;

        color: #f85149;

        text-shadow:
            0 0 14px
            rgba(248,81,73,.65);
    }

    70% {
        transform:
            translateY(-2px)
            scale(1.02);
    }

    100% {
        transform:
            translateY(0)
            scale(1);

        color: #f0f6fc;

        text-shadow: none;

        filter: blur(0);
    }
}

/* ↑ ↓ */

.change {
    display: inline-block;

    margin-left: 8px;

    font-size: 11px;
    font-weight: 700;

    opacity: 0;
}

.change.show {
    animation:
        changePop .7s ease forwards;
}

.change.up {
    color: #3fb950;
}

.change.down {
    color: #f85149;
}

@keyframes changePop {

    0% {
        opacity: 0;
        transform: translateY(5px);
    }

    25% {
        opacity: 1;
        transform: translateY(0);
    }

    70% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translateY(-4px);
    }
}

/* RECHTS */

.stats {
    width: 155px;
    flex-shrink: 0;
}

.progress-top {
    display: flex;
    justify-content: space-between;

    margin-bottom: 6px;

    color: #8b949e;

    font-size: 9px;
}

.progress-top strong {
    color: #f0f6fc;
}

.progress {
    width: 100%;
    height: 7px;

    background: #21262d;

    border-radius: 5px;

    overflow: hidden;
}

.bar {
    width: 0%;
    height: 100%;

    background: #238636;

    border-radius: 5px;

    transition:
        width .7s
        cubic-bezier(.2,.8,.2,1);

    position: relative;
}

.bar::after {
    content: "";

    position: absolute;

    top: 0;
    bottom: 0;

    width: 50px;
    right: -50px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.45),
            transparent
        );

    opacity: 0;
}

.bar.animate::after {
    opacity: 1;

    animation: shine .7s ease;
}

@keyframes shine {
    from {
        right: 100%;
    }

    to {
        right: -50px;
    }
}

.percent {
    margin-top: 5px;

    color: #6e7681;

    font-size: 9px;

    text-align: right;
}

.goal {
    margin-top: 8px;

    color: #8b949e;

    font-size: 9px;

    text-align: right;
}

.goal strong {
    color: #f0f6fc;
}

/* 600 */

.complete {
    border-color: #238636;

    box-shadow:
        0 6px 20px rgba(0,0,0,.35),
        0 0 25px rgba(63,185,80,.15);
}

.complete .bar {
    background:
        linear-gradient(
            90deg,
            #238636,
            #3fb950
        );

    box-shadow:
        0 0 10px
        rgba(63,185,80,.6);
}

/* CONFETTI */

.confetti {
    position: fixed;

    top: -20px;

    width: 6px;
    height: 9px;

    z-index: 100;

    pointer-events: none;

    animation:
        fall linear forwards;
}

@keyframes fall {
    to {
        transform:
            translateY(110vh)
            rotate(720deg);

        opacity: 0;
    }
}

/* MOBIEL */

@media(max-width:600px) {

    .card {
        width: 95vw;
        height: 110px;

        padding: 13px 15px;

        gap: 12px;
    }

    .info {
        width: 105px;
    }

    .stats {
        width: 125px;
    }

    .members {
        font-size: 32px;
    }

    h1 {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="card" id="card">

    <!-- LINKERKANT -->

    <div class="info">

        <div class="live">
            <span class="dot"></span>
            LIVE
        </div>

        <div class="title">
            Discord Community
        </div>

        <h1>
            Member Goal
        </h1>

    </div>


    <!-- MIDDEN -->

    <div class="counter">

        <span
            class="members"
            id="members"
        >
            Laden...
        </span>

        <span
            class="change"
            id="change"
        ></span>

    </div>


    <!-- RECHTS -->

    <div class="stats">

        <div class="progress-top">

            <span>
                Progress
            </span>

            <strong>
                <span id="current">0</span>
                / 650
            </strong>

        </div>

        <div class="progress">

            <div
                class="bar"
                id="bar"
            ></div>

        </div>

        <div class="percent">
            <span id="percent">0%</span>
        </div>

        <div class="goal">
            Goal:
            <strong>650</strong>
        </div>

    </div>

</div>


<script>

const INVITE = "ddhrpnl";
const GOAL = 650;

const members =
    document.getElementById("members");

const current =
    document.getElementById("current");

const bar =
    document.getElementById("bar");

const percent =
    document.getElementById("percent");

const change =
    document.getElementById("change");

const card =
    document.getElementById("card");

let oldCount = null;
let celebrated = false;


/* =========================
   MEMBER COUNT
========================= */

async function updateMembers() {

    try {

        const response = await fetch(
            "https://discord.com/api/v10/invites/"
            + INVITE
            + "?with_counts=true"
        );

        if (!response.ok) {
            throw new Error(
                "Discord API error"
            );
        }

        const data =
            await response.json();

        const count =
            data.approximate_member_count;

        if (
            typeof count !== "number"
        ) {
            throw new Error(
                "Geen member count"
            );
        }


        /* Eerste keer */

        if (oldCount === null) {

            members.textContent =
                count + " / " + GOAL;

        }


        /* OMHOOG */

        if (
            oldCount !== null &&
            count > oldCount
        ) {

            members.classList.remove(
                "up",
                "down"
            );

            change.classList.remove(
                "show",
                "up",
                "down"
            );

            bar.classList.remove(
                "animate"
            );

            void members.offsetWidth;
            void change.offsetWidth;
            void bar.offsetWidth;

            members.classList.add(
                "up"
            );

            change.textContent =
                "↑ +" +
                (count - oldCount);

            change.classList.add(
                "show",
                "up"
            );

            bar.classList.add(
                "animate"
            );

            members.textContent =
                count + " / " + GOAL;
        }


        /* OMLAAG */

        if (
            oldCount !== null &&
            count < oldCount
        ) {

            members.classList.remove(
                "up",
                "down"
            );

            change.classList.remove(
                "show",
                "up",
                "down"
            );

            void members.offsetWidth;
            void change.offsetWidth;

            members.classList.add(
                "down"
            );

            change.textContent =
                "↓ " +
                (count - oldCount);

            change.classList.add(
                "show",
                "down"
            );

            members.textContent =
                count + " / " + GOAL;
        }


        current.textContent =
            count;

        oldCount = count;


        /* PROGRESS */

        let progress =
            (count / GOAL) * 100;

        progress =
            Math.min(
                progress,
                100
            );

        bar.style.width =
            progress + "%";

        percent.textContent =
            Math.floor(progress) + "%";


        /* 600 BEREIKT */

        if (
            count >= GOAL &&
            !celebrated
        ) {

            celebrated = true;

            card.classList.add(
                "complete"
            );

            createConfetti();
        }

    }

    catch (error) {

        console.error(error);

        if (oldCount === null) {

            members.textContent =
                "Niet beschikbaar";
        }
    }
}


/* =========================
   CONFETTI
========================= */

function createConfetti() {

    const colors = [
        "#3fb950",
        "#58a6ff",
        "#a371f7",
        "#f778ba",
        "#d29922",
        "#ffffff"
    ];

    for (
        let i = 0;
        i < 150;
        i++
    ) {

        const piece =
            document.createElement(
                "div"
            );

        piece.className =
            "confetti";

        piece.style.left =
            Math.random() * 100 +
            "vw";

        piece.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];

        piece.style.animationDuration =
            2 +
            Math.random() * 3 +
            "s";

        piece.style.animationDelay =
            Math.random() * .7 +
            "s";

        document.body.appendChild(
            piece
        );

        setTimeout(() => {
            piece.remove();
        }, 6000);
    }
}


/* START */

updateMembers();

/* Elke 10 seconden */

setInterval(
    updateMembers,
    10000
);

</script>

</body>
</html>
